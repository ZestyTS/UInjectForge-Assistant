name: Wii U release preparation
on:
  workflow_dispatch:
    inputs:
      version:
        description: Component version matching the reviewed source mapping
        required: true
        default: 1.0.6
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify source mapping and packaging
        shell: pwsh
        run: |
          ./Scripts/Test-SourceMapping.ps1 -TempRoot (Join-Path $env:RUNNER_TEMP ("source-mapping-" + [Guid]::NewGuid().ToString('N')))
          ./Scripts/Test-ReleasePreparation.ps1 -TempRoot (Join-Path $env:RUNNER_TEMP ("release-preparation-" + [Guid]::NewGuid().ToString('N')))
      - name: Build verified binary and source packages
        shell: pwsh
        env:
          UIF_COMPONENT_VERSION: ${{ inputs.version }}
        run: ./Scripts/Build-Release.ps1 -Version $env:UIF_COMPONENT_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: UInjectForge-Assistant-release-preparation
          if-no-files-found: error
          path: |
            artifacts/**/UInjectForge-Assistant-*-WiiU.zip
            artifacts/**/UInjectForge-Assistant-*-Source.zip
            artifacts/**/SHA256SUMS.txt
